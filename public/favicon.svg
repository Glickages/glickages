<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Enhanced Geometric Block Logo</title>
  <desc id="desc">A minimalist modular logo made from blue and white rounded blocks on a black background.</desc>

  <rect width="1024" height="1024" fill="#030303"/>

  <defs>
    <linearGradient id="blueGradient" x1="280" y1="285" x2="760" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1688FF"/>
      <stop offset="1" stop-color="#006BFF"/>
    </linearGradient>

    <linearGradient id="whiteGradient" x1="285" y1="250" x2="760" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F5F8"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.38"/>
    </filter>

    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#0077FF" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Logo mark -->
  <g filter="url(#softShadow)">
    <!-- Top blue bar -->
    <rect x="274" y="248" width="326" height="132" rx="12" fill="url(#blueGradient)" filter="url(#blueGlow)"/>

    <!-- Top-right white block -->
    <rect x="625" y="248" width="132" height="132" rx="12" fill="url(#whiteGradient)"/>

    <!-- Middle-left white block -->
    <rect x="274" y="414" width="132" height="132" rx="12" fill="url(#whiteGradient)"/>

    <!-- Bottom-left white block -->
    <rect x="274" y="580" width="132" height="132" rx="12" fill="url(#whiteGradient)"/>

    <!-- Bottom-middle white block -->
    <rect x="440" y="580" width="160" height="132" rx="12" fill="url(#whiteGradient)"/>

    <!-- Right blue vertical bar -->
    <rect x="625" y="414" width="132" height="298" rx="12" fill="url(#blueGradient)" filter="url(#blueGlow)"/>
  </g>
</svg>
